      var TgGetApp = function () {

        if (typeof gameInstance === 'undefined' || !gameInstance) return;

        if (cbid) payload.cbid = cbid;

      };

      // ---------- 存储层：CloudStorage / DeviceStorage / SecureStorage 单键聚合 ----------
      function tgStoreAdapter(pick) {
        return {
          get: function (keys, cb) {
            var app = TgGetApp();
            var store = app && pick(app);
            var ks = (keys || []).map(String);
            if (!store || !store.getItem) { var out = {}; ks.forEach(function (k) { out[k] = null; }); cb(null, out); return; }
            if (ks.length === 0) { cb(null, {}); return; }
            var res = {}, pending = ks.length, failed = false;
            ks.forEach(function (k) {
              store.getItem(k, function (err, v) {
                if (failed) return;
                if (err) { failed = true; cb(err, null); return; }
                res[k] = (v === null || v === undefined) ? null : String(v);
                if (--pending === 0) cb(null, res);
              });
            });
          },
          set: function (key, value, cb) {
            var app = TgGetApp();
            var store = app && pick(app);
            if (!store || !store.setItem) { cb && cb('no_store'); return; }
            store.setItem(String(key), String(value), function (err, ok) { cb && cb(err || null, !!ok); });
          },

            var app = TgGetApp();
            var store = app && pick(app);
            var ks = (keys || []).map(String);
            if (!store || !store.removeItem) { cb && cb('no_store'); return; }
            if (ks.length === 0) { cb && cb(null, true); return; }
            var pending = ks.length, failed = false;
            ks.forEach(function (k) {
              store.removeItem(k, function (err) {
                if (failed) return;
                if (err) { failed = true; cb && cb(err, null); return; }
                if (--pending === 0 && cb) cb(null, true);
              });
            });
          },
        };

      // 资源版本检测：与本地记录比对，变化且开启自动刷新时刷新一次（sessionStorage 防循环）
      function tgVersionCheck() {
        var base = TG_RESOURCE_BASE ? TG_RESOURCE_BASE.replace(/\/+$/, '') + '/' : '';
        fetch(base + 'tg-version.txt', { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.text() : ''; })
          .then(function (v) {
            v = (v || '').trim();

            var stored = null; try { stored = localStorage.getItem('tg_build_id'); } catch (e) {}
            if (stored === v) return;
            if (!stored) { try { localStorage.setItem('tg_build_id', v); } catch (e) {} return; }
            if (!TG_AUTO_RELOAD) { tgLog('资源版本变化(' + stored + ' → ' + v + ')，未开启自动刷新'); return; }
            var guard = null; try { guard = sessionStorage.getItem('tg_reloaded'); } catch (e) {}
            if (guard === v) return;
            try { sessionStorage.setItem('tg_reloaded', v); localStorage.setItem('tg_build_id', v); } catch (e) {}
